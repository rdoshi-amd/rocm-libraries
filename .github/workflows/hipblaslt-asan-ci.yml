name: hipBLASLt ASAN pool investigation
run-name: ASAN paired trial ${{ inputs.trial }}

on:
  workflow_dispatch:
    inputs:
      trial:
        description: Fixed-batch trial identifier
        required: true
        default: pilot-01
        type: string

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: "${{ inputs.trial }} / ${{ matrix.pool }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pool: original
            runner: linux-gfx90a-gpu-rocm
          - pool: alternate
            runner: linux-gfx90a-1gpu-ossci-rocm
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    defaults:
      run:
        shell: bash
    env:
      DIAGNOSTIC_PAIR: ${{ inputs.trial }}
      DIAGNOSTIC_POOL: ${{ matrix.pool }}
      HSA_XNACK: 1
      OMP_NUM_THREADS: 1
      GTEST_SHARD_INDEX: 0
      GTEST_TOTAL_SHARDS: 1
    steps:
      - name: Checkout diagnostic and suppression files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: rocm-libraries
          sparse-checkout: |
            .github/scripts/asan-pool-investigation
            test/therock
            projects/hipblas-common/library/include
          persist-credentials: false

      - name: Download the immutable passing PR artifact
        id: artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 15
        with:
          artifact-ids: "11364355680"
          run-id: "37351278101"
          repository: ROCm/rocm-libraries
          github-token: ${{ github.token }}
          path: asan-trees
          merge-multiple: true

      - name: Assemble and fingerprint the artifact
        id: assemble
        run: |
          set -euo pipefail
          mkdir -p build diagnostics
          sha256sum asan-trees/*.tar.gz > diagnostics/archive-sha256.txt
          tar -C build -xzf asan-trees/hipblaslt-dist.tar.gz
          tar -C build -xzf asan-trees/hipblaslt-stage.tar.gz
          test -x build/bin/hipblaslt-test
          sha256sum build/bin/hipblaslt-test build/lib/libamdhip64.so* build/lib/libhsa-runtime64.so* \
            > diagnostics/runtime-sha256.txt
          git -C rocm-libraries rev-parse HEAD > diagnostics/diagnostic-revision.txt
          sha256sum rocm-libraries/test/therock/lsan.supp > diagnostics/suppression-sha256.txt
          artifact_root="$GITHUB_WORKSPACE/build"
          asan_runtime=$(find "$artifact_root/lib/llvm/lib/clang" -name 'libclang_rt.asan*.so' | sort | head -1)
          test -n "$asan_runtime"
          {
            echo "ASAN_OPTIONS=quarantine_size_mb=600"
            echo "LSAN_OPTIONS=suppressions=$GITHUB_WORKSPACE/rocm-libraries/test/therock/lsan.supp:print_suppressions=0"
            echo "ASAN_SYMBOLIZER_PATH=$artifact_root/lib/llvm/bin/llvm-symbolizer"
            echo "LD_LIBRARY_PATH=$artifact_root/lib:$(dirname "$asan_runtime"):${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Prepare optional debugger without changing the host
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        run: bash rocm-libraries/.github/scripts/asan-pool-investigation/prepare-debugger.sh

      - name: Unchanged smoke trial before any HIP probe
        id: smoke
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 23
        env:
          DIAGNOSTIC_RUNNER: ${{ runner.name }}
        run: python3 rocm-libraries/.github/scripts/asan-pool-investigation/run.py --phase smoke

      - name: Build normally linked probes with the artifact compiler and runtime
        id: build-probes
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -o pipefail
          bash rocm-libraries/.github/scripts/asan-pool-investigation/compile-probes.sh build diagnostics \
            2>&1 | tee diagnostics/probe-build.log

      - name: Run marked HIP and hipBLASLt startup probes after the trial
        id: probes
        if: ${{ !cancelled() && steps.build-probes.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 9
        env:
          DIAGNOSTIC_RUNNER: ${{ runner.name }}
        run: python3 rocm-libraries/.github/scripts/asan-pool-investigation/run.py --phase probes

      - name: Preserve every trial's evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: asan-pair-${{ inputs.trial }}-${{ matrix.pool }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Report smoke and probe results separately
        if: ${{ always() }}
        env:
          SMOKE_STEP: ${{ steps.smoke.outcome }}
          PROBE_BUILD_STEP: ${{ steps.build-probes.outcome }}
          PROBES_STEP: ${{ steps.probes.outcome }}
        run: |
          python3 - <<'PYREPORT'
          import json
          import os
          from pathlib import Path
          for path in sorted(Path("diagnostics").glob("*-result.json")):
              print(path.name, path.read_text())
          steps = {name: os.environ[name] for name in ("SMOKE_STEP", "PROBE_BUILD_STEP", "PROBES_STEP")}
          print(json.dumps(steps))
          raise SystemExit(0 if all(value == "success" for value in steps.values()) else 1)
          PYREPORT
