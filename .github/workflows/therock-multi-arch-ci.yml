# Temporary validation of TheRock's library-only test selection.
name: TheRock Multi-Arch CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  setup:
    uses: ROCm/TheRock/.github/workflows/setup_multi_arch.yml@795a072ad4b01ab4f6b006e9006552397e63741e
    with:
      repository: ROCm/TheRock
      ref: 795a072ad4b01ab4f6b006e9006552397e63741e
      build_variant: release
      linux_amdgpu_families: gfx94X
      windows_amdgpu_families: none
      linux_test_labels: test:rocblas
      changed_projects: projects/rocblas
      stage_reuse_mode: "off"
      build_python_packages: false
      build_native_linux: false
      build_pytorch: false
      build_jax: false
      external_repo: '{"repository":"ROCm/rocm-libraries","ref":"${{ github.sha }}"}'
  verify_selection:
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - name: Check library-only selection with compiler-runtime included
        env:
          BUILD_CONFIG: ${{ needs.setup.outputs.linux_build_config }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          config = json.loads(os.environ["BUILD_CONFIG"])
          assert "compiler-runtime" not in config["skip_stages"].split(",")
          tests = config["per_family_info"][0]["test_configuration"]
          assert tests["sanity_component"] is None, tests
          names = [c["job_name"] for c in tests["components"]]
          assert names == ["rocblas"], names
          print("PASS: rocBLAS selected; sanity omitted even though compiler-runtime is included")
          PYTHON
