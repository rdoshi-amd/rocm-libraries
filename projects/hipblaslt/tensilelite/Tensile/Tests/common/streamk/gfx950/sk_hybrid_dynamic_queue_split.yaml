#
# Dynamic StreamK (SK5 Hybrid, DynamicWorkQueue sub-path): split tiles on
# the per-XCD work queues, in the three queue regimes, launched several
# times per solution.
#
# Grids are for gfx950 (256 CUs, 8 queues): the MT64x64 kernels run 3
# workgroups per CU (768 slots).
#
# - split below the queue count, parallel (PostGSU) reduction: 128 tiles of
#   split 6, batch 1 (with edge tiles) and 2;
# - split 2 (below StreamKDynamicParallelMinSplit), arrival fixup: 288
#   tiles, batch 1 and 2;
# - split of the queue count or more: 32 tiles of split 24;
# - the WorkQueueStealing kernel pops the next queue too, so a tile's parts
#   can run on two XCDs.
#
# Validation checks the first launch per problem; the Synchronizer check (on
# by default) catches queue or arrival counters left nonzero, e.g. an item
# popped twice or never.
TestParameters:
  marks: [skip-gfx900, skip-gfx906, skip-gfx908, skip-gfx90a, skip-gfx940, skip-gfx941, skip-gfx942, skip-gfx1010, skip-gfx1011, skip-gfx1012, skip-gfx1030, skip-gfx1100, skip-gfx1101, skip-gfx1102, skip-gfx1200, skip-gfx1201, skip-gfx1250, skip-gfx1250-strict]

GlobalParameters:
  Architecture: gfx950
  HybridAssignmentPolicy: [DynamicWorkQueue]
  NumElementsToValidate: -1
  BoundsCheck: 0
  KernelTime: False
  CpuThreads: 16
  DataInitTypeAlpha: 1
  DataInitTypeBeta: 1
  DataInitTypeA: 12
  DataInitTypeB: 13
  DataInitTypeC: 12
  MaxWorkspaceSize: 134217728
  # Several launches of each kernel: 2 warmups and 2 runs per problem.
  SyncsPerBenchmark: 0
  NumWarmups: 2
  NumBenchmarks: 2
  SleepPercent: 0

.SkDynamicQueueSplitCommon: &sk_dynamic_queue_split_common
  - KernelLanguage: [Assembly]
  - TileProcessingStrategy: [StreamK]
  - WorkAssignment: [Hybrid]
  - GlobalSplitU: [0]
  - DepthU: [16]
  # MT 64x64.
  - MatrixInstruction: [[16, 16, 4, 1, 1, 2, 2, 2, 2]]
  - GlobalReadVectorWidthA: [1]
  - GlobalReadVectorWidthB: [1]
  - LocalReadVectorWidth: [1]
  - VectorWidthA: [1]
  - VectorWidthB: [1]
  - MIArchVgpr: [False]
  - PrefetchGlobalRead: [2]
  - PrefetchLocalRead: [1]
  - 1LDSBuffer: [1]
  - ExpandPointerSwap: [False]
  - ScheduleIterAlg: [3]
  - SourceSwap: [True]
  - StoreRemapVectorWidth: [0]
  - TransposeLDS: [0]
  - WorkGroupMapping: [1]
  - StaggerU: [0]

BenchmarkProblems:
  - - OperationType: GEMM
      DataType: s
      TransposeA: False
      TransposeB: True
      UseBeta: True
      Batched: True
    - BenchmarkCommonParameters: *sk_dynamic_queue_split_common
      ForkParameters:
        - Groups:
          - # Auto WGMXCC (resolved to NUM_XCD at launch).
            - WorkGroupMappingXCC: -1
              PersistentXCCMapping: 0
              WorkQueueStealing: 0
            # SKXCC remap with WGMXCC > 1.
            - WorkGroupMappingXCC: 8
              PersistentXCCMapping: 8
              WorkQueueStealing: 0
            # Single-hop work stealing.
            - WorkGroupMappingXCC: -1
              PersistentXCCMapping: 0
              WorkQueueStealing: 1
      BenchmarkFinalParameters:
        - ProblemSizes:
          # 128 tiles of split 6 (768 parts), parallel reduction; edge tiles.
          - Exact: [1000, 500, 1, 4096]
          - Exact: [512, 512, 2, 2048]
          # 288 tiles of split 2 (576 parts), arrival fixup.
          - Exact: [1024, 1152, 1, 8192]
          - Exact: [1024, 576, 2, 8192]
          # 32 tiles of split 24.
          - Exact: [512, 256, 1, 8192]
